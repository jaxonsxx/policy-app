<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create/Update Policy - ASA Policy App</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <img src="../assets/asalogo.png" alt="ASA Logo">
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search..." id="searchInput">
                </div>
                <div class="user-menu">
                    <span class="user-icon">👤</span>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="policies.html" class="nav-item active">
                    <span>Active Policies</span>
                </a>
                <a href="bylaw.html" class="nav-item">
                    <span>Bylaws</span>
                </a>
                <a href="approvals.html" class="nav-item">
                    <span>Policies for Approval</span>
                </a>
                <a href="suggestions-manage.html" class="nav-item">
                    <span>Student Suggestion</span>
                </a>
                <a href="master-dashboard.html" class="nav-item master-dashboard-link">
                    <span>Dashboard</span>
                </a>
                <a href="../public/policies.html" class="nav-item public-view-link">
                    <span>Public View</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1 id="formTitle">Create/Update Policy</h1>
            </div>

            <form id="policyForm" class="policy-form">
                <div class="form-group">
                    <label for="policyId">Policy ID</label>
                    <input type="text" id="policyId" name="policyId" placeholder="e.g., 1.1.1" required>
                </div>

                <div class="form-group">
                    <label for="policyName">Policy Name</label>
                    <input type="text" id="policyName" name="policyName" placeholder="Enter policy name" required>
                </div>

                <div class="form-group">
                    <label for="policyType">Type Policy</label>
                    <select id="policyType" name="policyType" required>
                        <option value="">Select type</option>
                        <option value="policy">Policy</option>
                        <option value="vision">Vision Statement</option>
                        <option value="code">Code of Conduct</option>
                        <option value="meeting">Board Meeting</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="section">Section</label>
                    <select id="section" name="section" required>
                        <option value="">Select section</option>
                        <option value="1">Organizational Identity & Values</option>
                        <option value="2">Governance & Elections</option>
                        <option value="3">Operations, Staff & Finance</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="policyContent">Policy</label>
                    <textarea id="policyContent" name="policyContent" rows="15" placeholder="Enter policy content..." required></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Submit for Approval</button>
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='policies.html'">Cancel</button>
                </div>
            </form>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
