<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Policy - ASA Policy App</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <img src="../assets/asalogo.png" alt="ASA Logo">
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search..." id="searchInput">
                </div>
                <div class="user-menu" onclick="toggleProfilePanel()">
                    <span class="user-icon" id="profileIcon">👤</span>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="policies.html" class="nav-item active">
                    <span>Active Policies</span>
                </a>
                <a href="bylaw.html" class="nav-item">
                    <span>Bylaws</span>
                </a>
                <a href="approvals.html" class="nav-item">
                    <span>Policies for Approval</span>
                </a>
                <a href="suggestions-manage.html" class="nav-item">
                    <span>Student Suggestion</span>
                </a>
                <a href="master-dashboard.html" class="nav-item master-dashboard-link">
                    <span>Dashboard</span>
                </a>
                <a href="../public/policies.html" class="nav-item public-view-link">
                    <span>Public View</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1 id="policyTitle">Policy Details</h1>
                <div class="view-actions">
                    <button class="btn btn-primary" id="editBtn" onclick="editPolicy()">Edit Policy</button>
                    <button class="btn btn-secondary" onclick="window.location.href='policies.html'">Back to Policies</button>
                </div>
            </div>

            <div class="policy-view-container">
                <div class="policy-view-card">
                    <div class="policy-view-header">
                        <div class="policy-view-meta">
                            <div class="policy-view-id">
                                <strong>Policy ID:</strong> <span id="policyId"></span>
                            </div>
                            <div class="policy-view-section">
                                <strong>Section:</strong> <span id="policySection"></span>
                            </div>
                            <div class="policy-view-status">
                                <strong>Status:</strong> <span id="policyStatus"></span>
                            </div>
                        </div>
                    </div>
                    <div class="policy-view-content">
                        <div id="policyContent"></div>
                    </div>
                    <div class="policy-review-section">
                        <h3>Annual Policy Review</h3>
                        <p class="review-description">Please review this policy and provide your assessment:</p>
                        <form id="reviewForm" class="review-form">
                            <div class="review-options">
                                <label class="review-option">
                                    <input type="radio" name="reviewStatus" value="confirm" id="reviewConfirm">
                                    <span class="radio-label">Confirm</span>
                                </label>
                                <label class="review-option">
                                    <input type="radio" name="reviewStatus" value="needs_work" id="reviewNeedsWork">
                                    <span class="radio-label">Needs Work</span>
                                </label>
                            </div>
                            <div class="review-actions">
                                <button type="submit" class="btn btn-primary">Submit Review</button>
                            </div>
                            <div id="reviewStatusMessage" class="review-status-message"></div>
                        </form>
                    </div>
                    <div class="policy-view-footer">
                        <div class="policy-view-dates">
                            <div><strong>Created:</strong> <span id="createdAt"></span></div>
                            <div><strong>Last Updated:</strong> <span id="updatedAt"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        // Load policy data on page load
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const policyId = urlParams.get('id');
            
            if (policyId) {
                loadPolicyView(policyId);
            } else {
                window.location.href = 'policies.html';
            }
        });

        function loadPolicyView(id) {
            const policies = getPolicies();
            const policy = policies.find(p => p.id === id);
            
            if (!policy) {
                alert('Policy not found');
                window.location.href = 'policies.html';
                return;
            }

            // Populate the view
            document.getElementById('policyTitle').textContent = policy.name || policy.policyName || 'Untitled Policy';
            document.getElementById('policyId').textContent = policy.policyId || policy.id;
            const sectionName = getSectionName(policy.section || 'N/A');
            document.getElementById('policySection').textContent = sectionName;
            
            const statusClass = policy.status || 'draft';
            const statusText = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
            document.getElementById('policyStatus').innerHTML = `<span class="policy-status ${statusClass}">${statusText}</span>`;
            
            // Format content with line breaks
            const content = policy.content || policy.policyContent || 'No content available';
            document.getElementById('policyContent').innerHTML = formatContent(content);
            
            // Format dates
            if (policy.createdAt) {
                document.getElementById('createdAt').textContent = new Date(policy.createdAt).toLocaleString();
            }
            if (policy.updatedAt) {
                document.getElementById('updatedAt').textContent = new Date(policy.updatedAt).toLocaleString();
            }

            // Store policy ID for edit button
            document.getElementById('editBtn').dataset.policyId = id;
            
            // Load existing review if any
            loadExistingReview(id);
        }
        
        function loadExistingReview(policyId) {
            const reviews = getReviews();
            const currentUser = getCurrentUser();
            const existingReview = reviews.find(r => r.policyId === policyId && r.reviewerId === currentUser);
            
            if (existingReview) {
                if (existingReview.status === 'confirm') {
                    document.getElementById('reviewConfirm').checked = true;
                } else if (existingReview.status === 'needs_work') {
                    document.getElementById('reviewNeedsWork').checked = true;
                }
                showReviewMessage('Your review has been submitted.', 'success');
            }
        }
        
        function getCurrentUser() {
            let userId = localStorage.getItem('asa_current_user');
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                localStorage.setItem('asa_current_user', userId);
            }
            return userId;
        }
        
        function getReviews() {
            const stored = localStorage.getItem('asa_policy_reviews');
            return stored ? JSON.parse(stored) : [];
        }
        
        function saveReviews(reviews) {
            localStorage.setItem('asa_policy_reviews', JSON.stringify(reviews));
        }
        
        function showReviewMessage(message, type) {
            const messageEl = document.getElementById('reviewStatusMessage');
            messageEl.textContent = message;
            messageEl.className = 'review-status-message ' + type;
            messageEl.style.display = 'block';
            
            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 3000);
        }

        function formatContent(content) {
            // Convert newlines to <br> and preserve formatting
            return content
                .replace(/\n/g, '<br>')
                .replace(/\r\n/g, '<br>');
        }
        
        function getSectionName(section) {
            const sectionNames = {
                '1': 'Organizational Identity & Values',
                '2': 'Governance & Elections',
                '3': 'Operations, Staff & Finance'
            };
            return sectionNames[section] || `Section ${section}`;
        }

        function editPolicy() {
            const policyId = document.getElementById('editBtn').dataset.policyId;
            if (policyId) {
                window.location.href = `policy-form.html?id=${policyId}`;
            }
        }
        
        // Handle review form submission
        document.getElementById('reviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const urlParams = new URLSearchParams(window.location.search);
            const policyId = urlParams.get('id');
            const reviewStatus = document.querySelector('input[name="reviewStatus"]:checked');
            
            if (!reviewStatus) {
                showReviewMessage('Please select a review option.', 'error');
                return;
            }
            
            const reviews = getReviews();
            const currentUser = getCurrentUser();
            
            // Remove existing review by this user for this policy
            const filteredReviews = reviews.filter(r => !(r.policyId === policyId && r.reviewerId === currentUser));
            
            // Add new review
            const newReview = {
                id: 'review_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                policyId: policyId,
                reviewerId: currentUser,
                reviewerName: 'Committee Member', // In production, get from user session
                status: reviewStatus.value,
                reviewedAt: new Date().toISOString(),
                year: new Date().getFullYear()
            };
            
            filteredReviews.push(newReview);
            saveReviews(filteredReviews);
            
            showReviewMessage('Review submitted successfully!', 'success');
        });
    </script>
    <!-- Profile Side Panel -->
    <div id="profilePanel" class="profile-panel hidden">
        <div class="profile-panel-overlay" onclick="closeProfilePanel()"></div>
        <div class="profile-panel-content">
            <div class="profile-panel-header">
                <h2>Profile</h2>
                <button class="profile-close-btn" onclick="closeProfilePanel()" aria-label="Close profile panel">×</button>
            </div>
            <div class="profile-panel-body"><div class="profile-info">
                    <div class="profile-field">
                        <label>First Name</label>
                        <div class="profile-value" id="profileFirstName">-</div>
                    </div>
                    <div class="profile-field">
                        <label>Last Name</label>
                        <div class="profile-value" id="profileLastName">-</div>
                    </div>
                    <div class="profile-field">
                        <label>Email</label>
                        <div class="profile-value" id="profileEmail">-</div>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadProfileData();
        });
    </script>
</body>
</html>
