<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Policies for Approval - ASA Policy App</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <img src="../assets/asalogo.png" alt="ASA Logo">
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search..." id="searchInput">
                </div>
                <div class="user-menu">
                    <span class="user-icon">👤</span>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="policies.html" class="nav-item">
                    <span>Active Policies</span>
                </a>
                <a href="bylaw.html" class="nav-item">
                    <span>Bylaws</span>
                </a>
                <a href="approvals.html" class="nav-item active">
                    <span>Policies for Approval</span>
                </a>
                <a href="suggestions-manage.html" class="nav-item">
                    <span>Student Suggestion</span>
                </a>
                <a href="master-dashboard.html" class="nav-item master-dashboard-link">
                    <span>Dashboard</span>
                </a>
                <a href="../public/policies.html" class="nav-item public-view-link">
                    <span>Public View</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1>Policies for Approval</h1>
                <p>Review and approve or disapprove pending policies and bylaws</p>
            </div>

            <div class="approvals-container">
                <div class="approvals-tabs">
                    <button class="tab-btn active" data-tab="policies" onclick="switchTab('policies')">Pending Policies</button>
                    <button class="tab-btn" data-tab="bylaws" onclick="switchTab('bylaws')">Pending Bylaws</button>
                </div>

                <div class="approvals-content">
                    <div id="policiesTab" class="tab-content active">
                        <div class="approvals-list" id="pendingPoliciesList">
                            <!-- Pending policies will be loaded here -->
                        </div>
                    </div>

                    <div id="bylawsTab" class="tab-content">
                        <div class="approvals-list" id="pendingBylawsList">
                            <!-- Pending bylaws will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        // Load pending items on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadPendingPolicies();
            loadPendingBylaws();
            initSearch();
        });

        function switchTab(tab) {
            // Update tab buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tab}Tab`).classList.add('active');
        }

        function loadPendingPolicies() {
            const policies = getPolicies();
            const pending = policies.filter(p => p.status === 'pending');
            const container = document.getElementById('pendingPoliciesList');

            if (pending.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <div class="empty-state-text">No pending policies</div>
                        <div class="empty-state-subtext">All policies have been reviewed</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = pending.map(policy => renderApprovalItem(policy, 'policy')).join('');
        }

        function loadPendingBylaws() {
            const bylaws = getBylaws();
            const pending = bylaws.filter(b => b.status === 'pending');
            const container = document.getElementById('pendingBylawsList');

            if (pending.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <div class="empty-state-text">No pending bylaws</div>
                        <div class="empty-state-subtext">All bylaws have been reviewed</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = pending.map(bylaw => renderApprovalItem(bylaw, 'bylaw')).join('');
        }

        function renderApprovalItem(item, type) {
            const isPolicy = type === 'policy';
            const title = isPolicy ? (item.name || item.policyName) : (item.title || item.bylawTitle);
            const id = isPolicy ? item.policyId : `Bylaw #${item.number || item.bylawNumber}`;
            const content = isPolicy ? (item.content || item.policyContent) : (item.content || item.bylawContent);
            const preview = content.substring(0, 200) + (content.length > 200 ? '...' : '');

            return `
                <div class="approval-item" data-id="${item.id}" data-type="${type}">
                    <div class="approval-item-header">
                        <div class="approval-item-info">
                            <h3 class="approval-item-title">${title || 'Untitled'}</h3>
                            <div class="approval-item-meta">
                                <span class="approval-item-id">${id}</span>
                                ${isPolicy ? `<span class="approval-item-section">${getSectionName(item.section || 'N/A')}</span>` : ''}
                                <span class="approval-item-date">Submitted: ${new Date(item.createdAt || item.updatedAt).toLocaleDateString()}</span>
                            </div>
                        </div>
                        <div class="approval-item-actions">
                            <button class="btn btn-view" onclick="viewItem('${item.id}', '${type}')">View</button>
                        </div>
                    </div>
                    <div class="approval-item-content">
                        <p>${preview.replace(/\n/g, ' ')}</p>
                    </div>
                    <div class="approval-item-footer">
                        <button class="btn btn-approve" onclick="approveItem('${item.id}', '${type}')">✓ Approve</button>
                        <button class="btn btn-disapprove" onclick="disapproveItem('${item.id}', '${type}')">✗ Disapprove</button>
                    </div>
                </div>
            `;
        }

        function viewItem(id, type) {
            if (type === 'policy') {
                window.location.href = `policy-view.html?id=${id}`;
            } else {
                window.location.href = `bylaw-view.html?id=${id}`;
            }
        }

        function approveItem(id, type) {
            if (confirm('Are you sure you want to approve this item?')) {
                if (type === 'policy') {
                    approvePolicy(id, false);
                } else {
                    approveBylaw(id, false);
                }
                alert('Item approved successfully!');
                // Reload the lists
                loadPendingPolicies();
                loadPendingBylaws();
            }
        }

        function disapproveItem(id, type) {
            const reason = prompt('Please provide a reason for disapproval (optional):');
            if (reason !== null) { // User didn't cancel
                if (type === 'policy') {
                    disapprovePolicy(id, reason);
                } else {
                    disapproveBylaw(id, reason);
                }
                // Reload the lists
                loadPendingPolicies();
                loadPendingBylaws();
            }
        }

        function disapprovePolicy(id) {
            const policies = getPolicies();
            const index = policies.findIndex(p => p.id === id);
            if (index !== -1) {
                policies[index].status = 'disapproved';
                policies[index].disapprovedAt = new Date().toISOString();
                savePolicies(policies);
                alert('Policy has been disapproved.');
            }
        }

        function disapproveBylaw(id) {
            const bylaws = getBylaws();
            const index = bylaws.findIndex(b => b.id === id);
            if (index !== -1) {
                bylaws[index].status = 'disapproved';
                bylaws[index].disapprovedAt = new Date().toISOString();
                saveBylaws(bylaws);
                alert('Bylaw has been disapproved.');
            }
        }

        function initSearch() {
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', function(e) {
                    const query = e.target.value.toLowerCase();
                    filterApprovals(query);
                });
            }
        }

        function filterApprovals(query) {
            const items = document.querySelectorAll('.approval-item');
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'block' : 'none';
            });
        }

        function getSectionName(section) {
            const sectionNames = {
                '1': 'Organizational Identity & Values',
                '2': 'Governance & Elections',
                '3': 'Operations, Staff & Finance'
            };
            return sectionNames[section] || `Section ${section}`;
        }

        // Make functions globally accessible
        window.switchTab = switchTab;
        window.viewItem = viewItem;
        window.approveItem = approveItem;
        window.disapproveItem = disapproveItem;
    </script>
</body>
</html>
