<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Policies - ASA Policy App</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <img src="../assets/asalogo.png" alt="ASA Logo">
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search..." id="searchInput">
                </div>
                <div class="user-menu">
                    <span class="user-icon">👤</span>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="policies.html" class="nav-item active">
                    <span>Active Policies</span>
                </a>
                <a href="bylaw.html" class="nav-item">
                    <span>Bylaws</span>
                </a>
                <a href="approvals.html" class="nav-item">
                    <span>Policies for Approval</span>
                </a>
                <a href="suggestions-manage.html" class="nav-item">
                    <span>Student Suggestion</span>
                </a>
                <a href="master-dashboard.html" class="nav-item master-dashboard-link">
                    <span>Dashboard</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1>Active Policies</h1>
                <button class="btn btn-primary" onclick="window.location.href='policy-form.html'">+ Create New Policy</button>
            </div>

            <div class="policies-list" id="policiesList">
                <!-- Policies will be dynamically loaded here -->
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
