<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ASA Policy App</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <img src="../assets/asalogo.png" alt="ASA Logo">
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search..." id="searchInput">
                </div>
                <div class="user-menu" onclick="toggleProfilePanel()">
                    <span class="user-icon" id="profileIcon">👤</span>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="policies.html" class="nav-item active">
                    <span>Active Policies</span>
                </a>
                <a href="bylaw.html" class="nav-item">
                    <span>Bylaws</span>
                </a>
                <a href="approvals.html" class="nav-item">
                    <span>Policies for Approval</span>
                </a>
                <a href="suggestions-manage.html" class="nav-item">
                    <span>Student Suggestion</span>
                </a>
                <a href="master-dashboard.html" class="nav-item master-dashboard-link">
                    <span>Dashboard</span>
                </a>
                <a href="../public/policies.html" class="nav-item public-view-link">
                    <span>Public View</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1>Dashboard</h1>
                <p>Manage policies, bylaws, and student suggestions</p>
            </div>

            <div class="dashboard-stats">
                <div class="stat-card">
                    <h3>Total Policies</h3>
                    <p class="stat-number" id="totalPolicies">0</p>
                </div>
                <div class="stat-card">
                    <h3>Pending Approval</h3>
                    <p class="stat-number" id="pendingApproval">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total Bylaws</h3>
                    <p class="stat-number" id="totalBylaws">0</p>
                </div>
                <div class="stat-card">
                    <h3>New Suggestions</h3>
                    <p class="stat-number" id="newSuggestions">0</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Profile Side Panel -->
    <div id="profilePanel" class="profile-panel hidden">
        <div class="profile-panel-overlay" onclick="closeProfilePanel()"></div>
        <div class="profile-panel-content">
            <div class="profile-panel-header">
                <h2>Profile</h2>
                <button class="profile-close-btn" onclick="closeProfilePanel()" aria-label="Close profile panel">×</button>
            </div>
            <div class="profile-panel-body">
                <div class="profile-info">
                    <div class="profile-field">
                        <label>First Name</label>
                        <div class="profile-value" id="profileFirstName">-</div>
                    </div>
                    <div class="profile-field">
                        <label>Last Name</label>
                        <div class="profile-value" id="profileLastName">-</div>
                    </div>
                    <div class="profile-field">
                        <label>Email</label>
                        <div class="profile-value" id="profileEmail">-</div>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        // Load profile data when page loads
        document.addEventListener('DOMContentLoaded', function() {
            loadProfileData();
        });
    </script>
</body>
</html>
