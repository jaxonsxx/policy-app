<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Bylaw - ASA Policy App</title>
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-page">
    <header class="admin-header">
        <div class="header-content">
            <div class="logo">
                <img src="../assets/asalogo.png" alt="ASA Logo">
            </div>
            <div class="header-actions">
                <div class="search-bar">
                    <input type="text" placeholder="Search..." id="searchInput">
                </div>
                <div class="user-menu" onclick="toggleProfilePanel()">
                    <span class="user-icon" id="profileIcon">👤</span>
                </div>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <nav class="sidebar-nav">
                <a href="policies.html" class="nav-item">
                    <span>Active Policies</span>
                </a>
                <a href="bylaw.html" class="nav-item active">
                    <span>Bylaws</span>
                </a>
                <a href="approvals.html" class="nav-item">
                    <span>Policies for Approval</span>
                </a>
                <a href="suggestions-manage.html" class="nav-item">
                    <span>Student Suggestion</span>
                </a>
                <a href="master-dashboard.html" class="nav-item master-dashboard-link">
                    <span>Dashboard</span>
                </a>
                <a href="../public/policies.html" class="nav-item public-view-link">
                    <span>Public View</span>
                </a>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="page-header">
                <h1 id="bylawTitle">Bylaw Details</h1>
                <div class="view-actions">
                    <button class="btn btn-primary" id="editBtn" onclick="editBylaw()">Edit Bylaw</button>
                    <button class="btn btn-secondary" onclick="window.location.href='bylaw.html'">Back to Bylaws</button>
                </div>
            </div>

            <div class="policy-view-container">
                <div class="policy-view-card">
                    <div class="policy-view-header">
                        <div class="policy-view-meta">
                            <div class="policy-view-id">
                                <strong>Bylaw Number:</strong> <span id="bylawNumber"></span>
                            </div>
                            <div class="policy-view-status">
                                <strong>Status:</strong> <span id="bylawStatus"></span>
                            </div>
                        </div>
                    </div>
                    <div class="policy-view-content">
                        <div id="bylawContent"></div>
                    </div>
                    <div class="policy-view-footer">
                        <div class="policy-view-dates">
                            <div><strong>Created:</strong> <span id="createdAt"></span></div>
                            <div><strong>Last Updated:</strong> <span id="updatedAt"></span></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/admin.js"></script>
    <script>
        // Load bylaw data on page load
        document.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const bylawId = urlParams.get('id');
            
            if (bylawId) {
                loadBylawView(bylawId);
            } else {
                window.location.href = 'bylaw.html';
            }
        });

        function loadBylawView(id) {
            const bylaws = getBylaws();
            const bylaw = bylaws.find(b => b.id === id);
            
            if (!bylaw) {
                alert('Bylaw not found');
                window.location.href = 'bylaw.html';
                return;
            }

            // Populate the view
            document.getElementById('bylawTitle').textContent = bylaw.title || bylaw.bylawTitle || 'Untitled Bylaw';
            document.getElementById('bylawNumber').textContent = `#${bylaw.number || bylaw.bylawNumber || 'N/A'}`;
            
            const statusClass = bylaw.status || 'draft';
            const statusText = statusClass.charAt(0).toUpperCase() + statusClass.slice(1);
            document.getElementById('bylawStatus').innerHTML = `<span class="policy-status ${statusClass}">${statusText}</span>`;
            
            // Format content with line breaks
            const content = bylaw.content || bylaw.bylawContent || 'No content available';
            document.getElementById('bylawContent').innerHTML = formatContent(content);
            
            // Format dates
            if (bylaw.createdAt) {
                document.getElementById('createdAt').textContent = new Date(bylaw.createdAt).toLocaleString();
            }
            if (bylaw.updatedAt) {
                document.getElementById('updatedAt').textContent = new Date(bylaw.updatedAt).toLocaleString();
            }

            // Store bylaw ID for edit button
            document.getElementById('editBtn').dataset.bylawId = id;
        }

        function formatContent(content) {
            // Convert newlines to <br> and preserve formatting
            return content
                .replace(/\n/g, '<br>')
                .replace(/\r\n/g, '<br>');
        }

        function editBylaw() {
            const bylawId = document.getElementById('editBtn').dataset.bylawId;
            if (bylawId) {
                window.location.href = `bylaw-form.html?id=${bylawId}`;
            }
        }
    </script>
    <!-- Profile Side Panel -->
    <div id="profilePanel" class="profile-panel hidden">
        <div class="profile-panel-overlay" onclick="closeProfilePanel()"></div>
        <div class="profile-panel-content">
            <div class="profile-panel-header">
                <h2>Profile</h2>
                <button class="profile-close-btn" onclick="closeProfilePanel()" aria-label="Close profile panel">×</button>
            </div>
            <div class="profile-panel-body"><div class="profile-info">
                    <div class="profile-field">
                        <label>First Name</label>
                        <div class="profile-value" id="profileFirstName">-</div>
                    </div>
                    <div class="profile-field">
                        <label>Last Name</label>
                        <div class="profile-value" id="profileLastName">-</div>
                    </div>
                    <div class="profile-field">
                        <label>Email</label>
                        <div class="profile-value" id="profileEmail">-</div>
                    </div>
                </div>
                <div class="profile-actions">
                    <button class="btn btn-danger btn-block" onclick="handleLogout()">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadProfileData();
        });
    </script>
</body>
</html>
