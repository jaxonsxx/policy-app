# Netlify Configuration for ASA Policy App

[build]
  # Publish directory - Netlify will serve files from the frontend folder
  publish = "frontend"
  # No build command needed since this is a static site
  command = ""

# Redirect rules
[[redirects]]
  # Redirect root to the policies page
  from = "/"
  to = "/public/policies.html"
  status = 301

# Headers for security and CORS (if needed for API calls)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Headers for JavaScript files
[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

# Headers for CSS files
[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

